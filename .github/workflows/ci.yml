# Test and lint on every push and pull request.
#
# Command forms matter here: `uv run pytest` without `--extra dev` fails on a cold
# runner ("Failed to spawn: pytest"), because uv's implicit sync does not install
# extras. `--locked` makes the job fail on pyproject/uv.lock drift rather than
# silently relocking.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.11" and the declared classifiers.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The mlx extra is never synced: it pulls torch, and mlx-metal is macOS-only.
      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Lint
        run: uv run --extra dev ruff check src/ tests/

      - name: Test
        run: uv run --extra dev pytest
